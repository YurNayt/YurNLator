name: Build YurNLator

# - push to main: builds "standard" and refreshes the rolling "dev" pre-release
# - pull request: builds "standard" only (check)
# - manual run (Actions -> Build YurNLator -> Run workflow):
#     variant = one variant or "all"; release = a version like v0.1.0 to publish
#     a release with those APKs (a suffix like v0.1.0-alpha1 makes it a pre-release)
# - pushing a tag v*: builds every variant and publishes that release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant (standard, antutu, antutuAlt, ludashi, genshin, pubg, geekbench6) or all'
        default: 'all'
      release:
        description: 'Publish as release (e.g. v0.1.0 or v0.1.0-alpha1). Empty = just build'
        default: ''

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.pick.outputs.variants }}
    steps:
      - id: pick
        run: |
          ALL='["standard","antutu","antutuAlt","ludashi","genshin","pubg","geekbench6"]'
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then V="$ALL"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IN="${{ github.event.inputs.variant }}"
            if [[ "$IN" == "all" || -z "$IN" ]]; then V="$ALL"; else V="[\"$IN\"]"; fi
          else V='["standard"]'; fi
          echo "variants=$V" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.matrix.outputs.variants) }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone libadrenotools (pinned commit)
        run: |
          rm -rf app/src/main/cpp/adrenotools
          git clone https://github.com/Pipetto-crypto/libadrenotools.git app/src/main/cpp/adrenotools
          git -C app/src/main/cpp/adrenotools checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b
          mkdir -p app/src/main/cpp/adrenotools/lib
          git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git \
            app/src/main/cpp/adrenotools/lib/linkernsbypass

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build zstd

      - name: Restore signing key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.YURN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/yurn.jks"
            echo "YURN_KEYSTORE_FILE=$RUNNER_TEMP/yurn.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::YURN_KEYSTORE_BASE64 secret not set - signing with a throwaway debug key (builds won't update each other)"
          fi

      - name: Build ${{ matrix.variant }}
        env:
          YURN_KEYSTORE_PASSWORD: ${{ secrets.YURN_KEYSTORE_PASSWORD }}
          YURN_KEY_ALIAS: ${{ secrets.YURN_KEY_ALIAS }}
          YURN_KEY_PASSWORD: ${{ secrets.YURN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          V="${{ matrix.variant }}"
          set -o pipefail
          ./gradlew "assemble${V^}Release" --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Surface the real cause as annotations (readable without downloading logs)
          grep -nE "What went wrong|^e: |error:|Exception|Caused by|FAILED|Could not|> " build.log \
            | grep -vE "^\S*:\s+at " | head -40 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
          tail -60 build.log > build-tail.txt || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-${{ matrix.variant }}
          path: build.log

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/${{ matrix.variant }}/release/*.apk \
             "out/YurNLator-${{ github.ref_name }}-${{ matrix.variant }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: YurNLator-${{ matrix.variant }}
          path: out/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release != '') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: YurNLator-*
          path: dist
          merge-multiple: true

      - name: Rolling dev pre-release (latest build from main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT="${GITHUB_SHA::7}"
          for f in dist/*.apk; do mv "$f" "dist/YurNLator-dev-standard.apk"; done
          gh release delete dev --cleanup-tag -y || true
          gh release create dev dist/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Dev build ($SHORT)" \
            --notes "Latest automatic build from main, commit $SHORT. For testing; may be unstable."

      - name: Versioned release
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${{ github.event.inputs.release }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          PRE=""; [[ "$TAG" == *-* ]] && PRE="--prerelease"
          for f in dist/*.apk; do mv "$f" "${f/-$GITHUB_REF_NAME-/-$TAG-}" 2>/dev/null || true; done
          gh release create "$TAG" dist/*.apk $PRE --target "$GITHUB_SHA" \
            --title "YurNLator $TAG" --generate-notes
