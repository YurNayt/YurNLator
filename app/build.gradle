import java.net.URL
import java.nio.file.Files
import java.nio.file.Paths
import java.security.MessageDigest

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Adjust Gradle plugin versions if needed
        classpath 'com.android.tools.build:gradle:8.8.0'
    }

}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

tasks.register("downloadImageFS") {
    def assetDir = new File(project.rootDir, ["app","src","main","assets"].join(File.separator))
    File imageFS = new File(assetDir, "imagefs.tar.zst")
    int parts = 2

    doLast {
        if (!imageFS.exists()) {
            println("ImageFS was not present, downloading...\n")
            FileOutputStream outputStream = new FileOutputStream(imageFS)
            for (int i = 0; i < parts; i++) {
                File partFile = new File(assetDir, String.format("imagefs.tar.zst.%02d", i))
                String partURL = String.format("https://raw.githubusercontent.com/Other-backup/winlator-imagefs/main/imagefs.tar.zst.%02d", i)
                new URL(partURL).withInputStream { p ->
                    partFile.withOutputStream { it << p }
                    outputStream << partFile.bytes
                }
                partFile.delete()
            }
            outputStream.close()
        }
    }
}

tasks.register("downloadProton") {
    def assetDir = new File(project.rootDir, ["app","src","main","assets"].join(File.separator))
    File protonARM64EC = new File(assetDir, "proton-9.0-arm64ec.tar.zst")
    File staleProtonARM64EC = new File(assetDir, "proton-10.0-5-arm64ec.tar.zst")
    String protonURL = "https://github.com/Other-backup/winlator-imagefs-v2/releases/download/d/proton-wine-9.0-arm64ec.tar.zst"
    String protonSHA256 = "1d6e5f5585421e7ef2a1378028915bb3d2128766593d53c896b808b8ca66fe6c"
    long protonSize = 129997755L

    def fileSHA256 = { File file ->
        MessageDigest digest = MessageDigest.getInstance("SHA-256")
        file.withInputStream { input ->
            byte[] buffer = new byte[64 * 1024]
            int read
            while ((read = input.read(buffer)) != -1) digest.update(buffer, 0, read)
        }
        digest.digest().collect { String.format("%02x", ((int) it) & 0xff) }.join()
    }

    doLast {
        if (staleProtonARM64EC.exists()) staleProtonARM64EC.delete()

        boolean valid = protonARM64EC.isFile()
                && protonARM64EC.length() == protonSize
                && fileSHA256(protonARM64EC).equalsIgnoreCase(protonSHA256)
        if (!valid) {
            if (protonARM64EC.exists()) protonARM64EC.delete()
            println("Proton 9 ARM64EC was not present or failed validation, downloading...\n")
            new URL(protonURL).withInputStream { input ->
                protonARM64EC.withOutputStream { output -> output << input }
            }
            valid = protonARM64EC.isFile()
                    && protonARM64EC.length() == protonSize
                    && fileSHA256(protonARM64EC).equalsIgnoreCase(protonSHA256)
            if (!valid) {
                protonARM64EC.delete()
                throw new GradleException("Downloaded Proton 9 ARM64EC archive failed size/SHA-256 validation")
            }
        }
    }
}

tasks.register("prepareKotlinBuildScriptModel"){}
downloadProton.dependsOn(downloadImageFS)
preBuild.dependsOn(downloadProton)

android {
    namespace 'com.winlator.cmod'
    // Keep compileSdk from your current config. If you want to match Termux-X11, you could set to 34.
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.winlator.cmod"
        minSdkVersion 26
        // We’re preserving Winlator’s request to keep targetSdkVersion at 28
        targetSdkVersion 28

        // CI sets these from the run number: every build is a newer version, so Android
        // installs it as an update and the in-app version shows which build it is.
        versionCode((System.getenv("YURN_VERSION_CODE") ?: "1") as int)
        versionName(System.getenv("YURN_VERSION_NAME") ?: "0.1.0")

        // External native build from Winlator
        externalNativeBuild {
            cmake {
                cppFlags ''
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        // You originally only did arm64-v8a. If you want multi-ABI splits, see below.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }


    // Java versions: Winlator uses Java 17, Termux-X11 used 1.9
    // Using 17 is typically fine (covers 1.9 features).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-opt-in=androidx.compose.material3.ExperimentalMaterial3Api']
    }

    // Release signing: a stable key from CI secrets (YURN_KEYSTORE_*), so every new
    // build installs as an update. Without the secrets the debug key is used.
    signingConfigs {
        yurn {
            def ks = System.getenv("YURN_KEYSTORE_FILE")
            if (ks != null && new File(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("YURN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("YURN_KEY_ALIAS")
                keyPassword System.getenv("YURN_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            def ks = System.getenv("YURN_KEYSTORE_FILE")
            def useYurnKey = ks != null && new File(ks).exists()
            signingConfig = useYurnKey ? signingConfigs.yurn : signingConfigs.debug
            crunchPngs false
        }
    }

    // Package-name spoof variants. Each one installs as a separate app with its own data.
    // To add a variant: one line in the table below.
    //   flavor name     package name (applicationId)       label suffix
    def spoofs = [
        standard   : ["com.yurnayt.yurnlator",          ""],
        antutu     : ["com.antutu.ABenchMark",          " AnTuTu"],
        antutuAlt  : ["com.antutu.benchmark.full",      " AnTuTu Alt"],
        ludashi    : ["com.ludashi.benchmark",          " Ludashi"],
        ludashi2   : ["com.ludashi.benchmark2",         " Ludashi 2"],
        genshin    : ["com.miHoYo.GenshinImpact",       " Genshin"],
        pubg       : ["com.tencent.ig",                 " PUBG"],
        geekbench6 : ["com.primatelabs.geekbench6",     " Geekbench 6"],
        vivo       : ["com.netease.moba.vivo",          " vivo/iQOO"],
    ]

    flavorDimensions = ["spoof"]
    productFlavors {
        spoofs.each { name, cfg ->
            create(name) {
                dimension "spoof"
                applicationId cfg[0]
                resValue "string", "app_name", "YurNLator" + cfg[1]
            }
        }
    }

    lint {
        checkReleaseBuilds false
        disable 'ExpiredTargetSdkVersion'
    }

    ndkVersion '29.0.14206865'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    // If you want to be sure modern JNI packaging is used:
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            pickFirsts += ["assets/dexopt/baseline.prof", "assets/dexopt/baseline.profm"]
        }
    }

    buildFeatures {
        prefab = true
        compose = true
    }

}

